name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ui-checks:
    name: UI checks
    uses: omniviewdev/omniview/.github/workflows/e2e-runner.yml@main
    with:
      host-ref: main
      kubernetes-repository: ${{ github.event.pull_request.head.repo.full_name }}
      kubernetes-ref: ${{ github.event.pull_request.head.sha }}
      kubernetes-checks: true
