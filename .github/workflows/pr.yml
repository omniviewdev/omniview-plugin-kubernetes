name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ui-checks:
    name: UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          version: 12.14.0
          node-version-file: "false"
          install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "26.13.0"
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # The TypeScript 6 alias serves JS API consumers, not CLI typechecking.
      - name: Native typecheck
        run: pnpm exec node node_modules/@typescript/native/bin/tsc --noEmit

      - name: Behavior tests
        run: pnpm test

      - name: New York age-clock tests
        run: TZ=America/New_York pnpm exec vitest run src/utils/ageClock.test.tsx

      - name: Production UI build
        run: pnpm run build
