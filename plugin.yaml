id: kubernetes
version: 0.19.1
name: Kubernetes
icon: SiKubernetes
description: Kubernetes is an open-source system for automating deployment, scaling, and management of containerized applications.
repository: github.com/omniviewdev/omniview/plugins/kubernetes
website: kubernetes.io
category: cloud
license: Apache-2.0
author:
    name: Omniview
    email: info@omniview.dev
    url: https://omniview.dev
maintainers:
    - name: Omniview Maintainers
      email: info@omniview.dev
tags:
    - kubernetes
    - container
    - orchestration
    - cloud
capabilities:
    - ui
    - resource
    - exec
    - networker
    - log
    - metric
exports:
    connections:
        operations: [catalog, get, enumerate, update]
        resource_types:
            - "k8s:kustomize.toolkit.fluxcd.io/*"
            - "k8s:helm.toolkit.fluxcd.io/*"
            - "k8s:source.toolkit.fluxcd.io/*"
            - "k8s:notification.toolkit.fluxcd.io/*"
            - "k8s:image.toolkit.fluxcd.io/*"
theme:
    colors:
        primary: '#326CE5'
